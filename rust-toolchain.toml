[toolchain]
channel = "stable"
# The default profile adds rust-docs, which is 706 MiB of closure nobody reads
# from a terminal.
profile = "minimal"
components = ["rustfmt", "clippy", "rust-src", "rust-analyzer"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-linux-android",
  "x86_64-linux-android",
  # `flutter build apk` names every ABI Flutter supports on its Gradle command
  # line, and that overrides anything the project asks for, so the client is
  # built for 32-bit ARM whether or not anyone wants it there. See
  # crates/tachyx-client-ffi/rust-toolchain.toml, which must name it as well.
  "armv7-linux-androideabi",
]
