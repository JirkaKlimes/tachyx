[package]
name = "tachyx-unsafe"
description = "The one crate in tachyx where unsafe is permitted: the raw handles each platform hands across"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer.workspace = true
gstreamer-allocators.workspace = true
gstreamer-gl.workspace = true
gstreamer-gl-egl.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
ndk = { workspace = true, features = ["audio"] }

# This crate cannot take the workspace lints, because they forbid unsafe and a
# `forbid` cannot be lifted from inside the crate it applies to. The set below is
# the workspace set with that one line changed, so nothing else is lost.
[lints.rust]
unsafe_code = "warn"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
