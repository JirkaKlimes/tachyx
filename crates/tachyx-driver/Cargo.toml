[package]
name = "tachyx-driver"
description = "The client's I/O driver: owns the QUIC connection, runs the session, and feeds the decoder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tachyx-client.workspace = true
tachyx-proto.workspace = true
tachyx-crypto.workspace = true
# The pairing mailbox and the rendezvous. The client reaches a host by device
# rather than by address, and neither the mailbox nor the punch exists without
# this.
tachyx-relay.workspace = true
tachyx-sched.workspace = true
tachyx-transport.workspace = true
quinn.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# The loopback test plays the host, which means writing datagrams and a hello
# that no `HostSession` would write.
[dev-dependencies]
bytes.workspace = true
serde.workspace = true
# The shaped-path test drives the shipped controller against a userspace relay,
# so the test binary needs both the estimator and a UDP socket of its own.
tachyx-congestion.workspace = true
# The pairing and rendezvous tests run against a real relay rather than a mock,
# so the test binary binds one on the loopback interface.
tachyx-relayd.workspace = true
tokio = { workspace = true, features = ["net", "time"] }

[lints]
workspace = true
