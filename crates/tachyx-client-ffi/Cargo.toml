[package]
name = "tachyx-client-ffi"
description = "The flutter_rust_bridge boundary: translates between Dart and tachyx-client, and holds no logic of its own"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# staticlib for the platforms that link the client in, cdylib for the ones that
# load it at run time. Native assets picks whichever the target needs.
crate-type = ["cdylib", "staticlib"]

[dependencies]
tachyx-client.workspace = true
tachyx-driver.workspace = true
tachyx-proto.workspace = true
tachyx-video.workspace = true
anyhow.workspace = true
flutter_rust_bridge = "=2.13.0"

# This crate cannot take the workspace lints, because they forbid unsafe and
# `frb_generated.rs` is full of it: every call across the Dart boundary reads a
# pointer Dart wrote. That file is generated and rewritten on every codegen run,
# so there is nowhere durable to record an exception and nothing a warning would
# prompt anyone to fix. The crate earns the exemption by carrying no logic: it
# translates between the protocol types and the generated boundary, nothing more.
# The rest of the set below matches the workspace.
[lints.rust]
unsafe_code = "allow"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
