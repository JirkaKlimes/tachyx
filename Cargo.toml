[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Set by gstreamer 0.25, the oldest-tolerant version exposing the GStreamer 1.26
# surface the media pipeline needs.
rust-version = "1.92"
license = "AGPL-3.0-or-later"
repository = "https://github.com/JirkaKlimes/tachyx"

[workspace.dependencies]
tachyx-client = { path = "crates/tachyx-client" }
tachyx-congestion = { path = "crates/tachyx-congestion" }
tachyx-dmabuf = { path = "crates/tachyx-dmabuf" }
tachyx-driver = { path = "crates/tachyx-driver" }
tachyx-glctx = { path = "crates/tachyx-glctx" }
tachyx-hostd = { path = "crates/tachyx-hostd" }
tachyx-input = { path = "crates/tachyx-input" }
tachyx-media = { path = "crates/tachyx-media" }
tachyx-proto = { path = "crates/tachyx-proto" }
tachyx-surface = { path = "crates/tachyx-surface" }
tachyx-transport = { path = "crates/tachyx-transport" }
tachyx-video = { path = "crates/tachyx-video" }

anyhow = "1.0"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
keycode = "1.0"
postcard = { version = "1.1", features = ["use-std"] }
quinn = { version = "0.11", default-features = false, features = [
  "runtime-tokio",
  "rustls-ring",
  "log",
] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
# Parity for the video path. Chosen over `reed-solomon-erasure`, which was last
# released in 2022 and multiplies over GF(2^8) a byte at a time: at the 92 data
# and 18 parity shards of a 1080p key frame that is 2.3 MB of table lookups per
# frame. This one is an O(n log n) Leopard-RS coder over GF(2^16) with AVX2,
# SSSE3 and NEON back ends, released 2025-10, and it keeps its `unsafe` inside
# itself, so `tachyx-proto` stays `forbid(unsafe_code)`.
reed-solomon-simd = { version = "3.1", default-features = false, features = ["std"] }
# The SHA-256 behind a certificate fingerprint. Named here rather than taken
# through rustls, whose hash implementations are reachable only through a
# cipher suite.
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Reads the subject public key info out of a peer certificate, which is what a
# pin is taken over. Already in the tree as rustls' own certificate parser.
rustls-webpki = { version = "0.103", default-features = false, features = ["std"] }
rustix = { version = "1.1", features = ["event", "fs", "time"] }
serde = { version = "1.0", features = ["derive"] }
# The UDP socket the transport binds itself, to raise its receive and send
# buffers. quinn pulls socket2 in transitively but does not re-export it.
socket2 = "0.6"
thiserror = "2.0"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The GStreamer crates must move in lockstep; a mismatched pair fails to link.
gstreamer = { version = "0.25", features = ["v1_26"] }
gstreamer-allocators = { version = "0.25", features = ["v1_26"] }
gstreamer-app = { version = "0.25", features = ["v1_26"] }
gstreamer-gl = { version = "0.25", features = ["v1_26"] }
gstreamer-gl-egl = { version = "0.25", features = ["v1_26"] }
gstreamer-video = { version = "0.25", features = ["v1_26"] }

# The Flutter texture registry, reached from Rust. Its Linux payload registers a
# subclass of the embedder's `FlTextureGL`, which is the only interface the Linux
# embedder offers for a texture the application draws itself.
irondash_engine_context = "0.5"
irondash_texture = "0.5"

# The Android platform decoder and the window Flutter's surface producer stands
# on. `default-features = false` drops a raw window handle integration nothing
# here asks for.
ndk = { version = "0.9", default-features = false, features = [
  "media",
  "nativewindow",
  "api-level-28",
] }
# Pinned exactly. 0.22 changed the pointer type inside `JNIEnv`, which no longer
# matches the one `ndk` takes, and every call to it then needs a cast.
jni = "=0.21.1"

drm-fourcc = "2.2"
gbm = { version = "0.18", default-features = false }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# A latency measurement taken from an unoptimised build measures nothing. This
# applies to our own crates as well as to dependencies, because the packetiser
# and the reassembler are on the hot path.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
